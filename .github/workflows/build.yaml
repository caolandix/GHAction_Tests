name: Build Qt CMake C++ Project

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Application
    strategy:
      matrix:
        # Multi-platform matrix setup (Linux and Windows)
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      # 1. Fetch the repository source code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup CMake version
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.3.x' # Enforces the latest 4.3 patch release         

      # 2. Install native system build requirements
      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libopencv-dev libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0

      - name: Install Windows Dependencies and OpenCV Paths
        if: matrix.os == 'windows-latest'
        run: |
          choco install ninja opencv
          echo "OPENCV_DIR=C:\tools\opencv\build" >> $GITHUB_ENV
          echo "C:\tools\opencv\build\x64\vc16\bin" >> $GITHUB_PATH          

      # 3. Setup MSVC compiler environment on Windows
      - name: Setup MSVC (Windows Only)
        if: matrix.os == 'windows-latest'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      # 4. Install Qt binaries automatically via aqtinstall
      - name: Install Qt Framework
        uses: jurplel/install-qt-action@v4
        with:
          # Specify your targeted Qt version
          version: '6.11.0'
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git'
          # Select modules if your app uses non-core features (e.g., qtcharts)
          modules: 'qtshadertools'

      # 5. Generate build scripts using CMake & Build via Ninja
      - name: Configure and Build Project
        run: |
          cmake -S . -B build -G "Ninja" -D WITH_QT=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      # 6. Archive binary output files
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: built-app-${{ matrix.os }}
          path: |
            build/
